; Wizard Game balance. One section per spell (the section name is the file name of the spell in
; res://spells/, e.g. [dash] -> res://spells/dash.tres) plus [player].
;
; Any exported property of the spell can be set here; unknown keys are ignored. Shared keys:
;   rarity     rare | epic | legendary | primordial   (shown as Arcane / Eldritch / Celestial / Primordial)
;   mana_cost  mana spent per cast (minimum to start for spells that drain more while active)
;   hp_cost    health spent per cast - for spells so powerful they cost the caster's life
;              (the cast is refused if it would kill)
;   cooldown   seconds before the spell can be cast again
;
; Online the SERVER's copy of this file is used: it is loaded when the server starts and sent to
; every player when they join, so everyone plays by the same numbers. Offline the game reads its
; own copy (config/balance.cfg in the game folder). Restart the server after editing.

[player]
max_health = 100.0
max_mana = 100.0
; mana per second
mana_regen = 8.0

[dash]
rarity = "rare"
mana_cost = 20.0
hp_cost = 0.0
cooldown = 0.8
; metres travelled and seconds it takes
distance = 9.0
duration = 0.24

[sniper]
rarity = "epic"
mana_cost = 45.0
hp_cost = 0.0
cooldown = 1.5
damage = 70.0
max_range = 2000.0
; seconds the caster must stay scoped before it fires, zoom factor, movement while scoped
min_aim_time = 2.0
aim_zoom = 4.0
aim_move_factor = 0.45

[chain]
rarity = "epic"
; minimum mana to start; the chain then drains mana_per_meter while it grows (holding is free,
; but no mana regenerates while it is out). 1 = 1 mana per 1 m
mana_cost = 1.0
hp_cost = 0.0
cooldown = 0.6
mana_per_meter = 1.0
; m/s the head flies, and the longest it gets
grow_speed = 32.0
max_length = 100.0
; m/s the chain hauls with (sprint is 8.5, a dash ~45)
pull_speed = 13.0
; metres within which the head homes onto a target
homing_radius = 5.0

[sword]
rarity = "legendary"
mana_cost = 35.0
hp_cost = 0.0
cooldown = 6.0
; damage to anyone it lands on, seconds it stands
damage = 25.0
lifetime = 38.0
; how far away it can land (horizontal metres)
min_range = 5.0
max_range = 45.0

[minigun]
rarity = "epic"
; per orb
mana_cost = 1.0
hp_cost = 0.0
cooldown = 0.0
damage = 1.0
; shots per second at the start of the spin-up and at full spin
min_rate = 7.0
max_rate = 14.0
bolt_speed = 50.0
max_range = 250.0
; overheats after this many shots, locked for overheat_time s; heat lost per second when resting
max_heat = 100.0
overheat_time = 5.0
cool_rate = 22.0

[shield_bubble]
rarity = "legendary"
mana_cost = 40.0
hp_cost = 0.0
cooldown = 12.0
; damage it absorbs before shattering, radius in metres, seconds before it fades by itself
; (a Sword Wall landing on it shatters it at once)
hp = 150.0
radius = 7.2
lifetime = 120.0

[shield_wall]
rarity = "rare"
mana_cost = 0.0
hp_cost = 0.0
cooldown = 0.5
; largest size in rings of hexagons (0 = one hexagon)
max_rings = 4
; mana drained per point of damage blocked, plus this share per ring (ring 4 = 3x). Mana doesn't
; regenerate while the ward is up.
block_mana = 1.0
block_mana_per_ring = 0.5

[black_hole]
rarity = "primordial"
; it takes ALL the caster's mana (mana_cost is the minimum to cast), and this much of their life
mana_cost = 50.0
hp_cost = 25.0
cooldown = 120.0
; seconds it lives, and height above the caster it forms at
duration = 30.0
height = 45.0
; event horizon radius (m) and how much it swells over its life
horizon = 2.0
growth = 0.35
; pull reach (m) and pull speed at the horizon at the start / end of its life (m/s)
reach = 110.0
pull_start = 9.0
pull_end = 32.0
; anyone within this many horizon radii dies
kill_factor = 1.35

[fireball]
rarity = "epic"
mana_cost = 30.0
hp_cost = 0.0
cooldown = 1.2
; blast damage at the centre and at the edge, blast radius (m); the caster takes self_damage of it
damage = 45.0
min_damage = 10.0
blast_radius = 4.0
self_damage = 0.5
; launch speed (m/s) and gravity (m/s^2): the arc / drop-off
speed = 38.0
gravity = 7.0
; the pool of fire left on the ground: radius (m), seconds it burns
patch_radius = 4.0
patch_time = 7.0
; anyone in the fire burns for burn_time s at burn_dps damage per second (water puts it out)
burn_time = 3.5
burn_dps = 8.0

[inferno]
rarity = "legendary"
mana_cost = 60.0
hp_cost = 0.0
cooldown = 14.0
