; Resource pack definition. Textures in textures/ replace the defaults in res://textures/
; with the same file name; anything missing falls back to the default.
; Rebake: Godot_v4.7.2-stable_win64_console.exe --path . --script res://tools/bake_textures.gd
;         with the environment variable PACK=realistic (optionally BAKE_ONLY=rock,grass).

[pack]

name="Realistic"
description="2K textures: individual grass blades, fractured and weathered stone with mineral grains and lichen, pebbly soil with twigs and leaf litter, flaking bark, detailed leaves and needles."
author="Wizard Game"

[bake]

shader="res://resource_packs/realistic/bake/texture_bake.glsl"
; Rows per dispatch (keeps each GPU submission short).
strip=128
; name, mode (see the shader), size, normal strength (per 1024 px)
jobs=[["grass", 0, 2048, 6.0], ["rock", 1, 2048, 9.0], ["dirt", 2, 2048, 8.0], ["snow", 3, 1024, 4.0], ["bark_oak", 4, 2048, 10.0], ["bark_pine", 5, 2048, 10.0], ["leaves", 6, 2048, 3.0], ["needles", 7, 2048, 3.0], ["moss", 9, 2048, 6.0], ["water", 11, 1024, 5.0]]
