<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510">
  <!-- Grimoire page artwork for the Arcane Minigun spell: the frame and one symbol in the middle (at
       180,255; the page shader draws the spinning arcane circle behind it, radius ~142).
       Transparent background: only the ink is drawn onto the parchment. Edit freely. -->
  <g fill="none" stroke="#2b1a0e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Page frame with corner knots -->
    <rect x="22" y="22" width="316" height="466" rx="6" stroke-width="2.2" opacity="0.8"/>
    <rect x="30" y="30" width="300" height="450" rx="4" stroke-width="1" opacity="0.6"/>
    <g stroke-width="1.6" opacity="0.8">
      <path d="M30 52 q14 -2 22 -22 M308 30 q2 14 22 22 M30 458 q14 2 22 22 M308 480 q2 -14 22 -22"/>
      <circle cx="41" cy="41" r="4"/><circle cx="319" cy="41" r="4"/>
      <circle cx="41" cy="469" r="4"/><circle cx="319" cy="469" r="4"/>
    </g>

    <!-- Symbol -->
    <g transform="translate(180 255)">
    <circle r="82" stroke-width="6"/>
    <circle r="20" stroke-width="4"/>
    <circle cx="41.6" cy="24.0" r="15" stroke-width="4"/><circle cx="41.6" cy="24.0" r="5" fill="#8a2fc9" stroke="none"/><circle cx="0.0" cy="48.0" r="15" stroke-width="4"/><circle cx="0.0" cy="48.0" r="5" fill="#8a2fc9" stroke="none"/><circle cx="-41.6" cy="24.0" r="15" stroke-width="4"/><circle cx="-41.6" cy="24.0" r="5" fill="#8a2fc9" stroke="none"/><circle cx="-41.6" cy="-24.0" r="15" stroke-width="4"/><circle cx="-41.6" cy="-24.0" r="5" fill="#8a2fc9" stroke="none"/><circle cx="-0.0" cy="-48.0" r="15" stroke-width="4"/><circle cx="-0.0" cy="-48.0" r="5" fill="#8a2fc9" stroke="none"/><circle cx="41.6" cy="-24.0" r="15" stroke-width="4"/><circle cx="41.6" cy="-24.0" r="5" fill="#8a2fc9" stroke="none"/>
    <path d="M-96 -40 A104 104 0 0 1 -40 -96 M96 40 A104 104 0 0 1 40 96" stroke="#8a2fc9" stroke-width="4"/>
    </g>
  </g>
</svg>
