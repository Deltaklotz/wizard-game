<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510">
  <!-- Grimoire page artwork for the Money Rain spell: the frame and one symbol in the middle (at
       180,255; the page shader draws the spinning arcane circle behind it, radius ~142).
       Transparent background: only the ink is drawn onto the parchment. Edit freely. -->
  <g fill="none" stroke="#2b1a0e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Page frame with corner knots -->
    <rect x="22" y="22" width="316" height="466" rx="6" stroke-width="2.2" opacity="0.8"/>
    <rect x="30" y="30" width="300" height="450" rx="4" stroke-width="1" opacity="0.6"/>
    <g stroke-width="1.6" opacity="0.8">
      <path d="M30 52 q14 -2 22 -22 M308 30 q2 14 22 22 M30 458 q14 2 22 22 M308 480 q2 -14 22 -22"/>
      <circle cx="41" cy="41" r="4"/><circle cx="319" cy="41" r="4"/>
      <circle cx="41" cy="469" r="4"/><circle cx="319" cy="469" r="4"/>
    </g>

    <!-- Symbol -->
    <g transform="translate(180 255)">
    <path d="M-70 -50 C-100 -50 -104 -90 -74 -94 C-70 -124 -24 -128 -12 -104 C4 -132 56 -124 56 -94 C88 -96 96 -52 64 -50 Z" stroke-width="5"/>
    <path d="M-40 -44 L-62 70 M40 -44 L62 70" stroke="#b8860b" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="0" cy="40" r="26" stroke="#b8860b" stroke-width="5"/>
    <path d="M8 26 c-6 -6 -22 -4 -20 6 c2 10 22 6 22 16 c0 10 -18 12 -22 4 M-2 18 v46" stroke="#b8860b" stroke-width="4"/>
    <path d="M-36 -10 l-6 18 M34 -6 l6 18 M-14 0 l-2 12 M18 4 l2 12" stroke-width="3.5"/>
    <rect x="-80" y="76" width="44" height="22" rx="3" transform="rotate(-18 -58 87)" stroke="#2f7a2a" stroke-width="3.5"/>
    <rect x="36" y="70" width="44" height="22" rx="3" transform="rotate(14 58 81)" stroke="#2f7a2a" stroke-width="3.5"/>
    </g>
  </g>
</svg>
