<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510">
  <!-- Grimoire page artwork for the Dash spell: the frame and one symbol in the middle (at
       180,255; the page shader draws the spinning arcane circle behind it, radius ~142).
       Transparent background: only the ink is drawn onto the parchment. Edit freely. -->
  <g fill="none" stroke="#2b1a0e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Page frame with corner knots -->
    <rect x="22" y="22" width="316" height="466" rx="6" stroke-width="2.2" opacity="0.8"/>
    <rect x="30" y="30" width="300" height="450" rx="4" stroke-width="1" opacity="0.6"/>
    <g stroke-width="1.6" opacity="0.8">
      <path d="M30 52 q14 -2 22 -22 M308 30 q2 14 22 22 M30 458 q14 2 22 22 M308 480 q2 -14 22 -22"/>
      <circle cx="41" cy="41" r="4"/><circle cx="319" cy="41" r="4"/>
      <circle cx="41" cy="469" r="4"/><circle cx="319" cy="469" r="4"/>
    </g>

    <!-- Symbol -->
    <g transform="translate(180 255)">
    <path d="M-62 -66 L14 0 L-62 66" stroke-width="10"/>
    <path d="M-6 -66 L70 0 L-6 66" stroke="#14858a" stroke-width="10"/>
    <path d="M-112 -34 h38 M-124 0 h48 M-112 34 h38" stroke-width="4"/>
    <path d="M-100 -58 h22 M-100 58 h22" stroke-width="2.5" opacity="0.7"/>
    </g>
  </g>
</svg>
